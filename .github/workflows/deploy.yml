name: Deploy

on:
  workflow_dispatch:
    inputs:
      baseline_existing_db:
        description: 'Mark existing migrations as already applied before deploy (use only for the first deploy to an existing database)'
        required: false
        default: false
        type: boolean
      run_user_identity_migration:
        description: 'Migrate legacy GitHub users into the User/OAuthIdentity model (enable only for the one-time backfill)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  trigger:
    name: Sync & deploy CNB
    runs-on: ubuntu-latest
    concurrency:
      group: cnb-main-sync
      cancel-in-progress: false
    env:
      CNB_REPOSITORY_SLUG: ${{ vars.CNB_REPOSITORY_SLUG }}
      CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
      CNB_API_TOKEN: ${{ secrets.CNB_API_TOKEN }}
      CNB_BRANCH: main
      BASELINE_EXISTING_DB: ${{ inputs.baseline_existing_db }}
      RUN_USER_IDENTITY_MIGRATION: ${{ inputs.run_user_identity_migration }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          lfs: true

      - name: Validate CNB configuration
        run: |
          test -n "$CNB_REPOSITORY_SLUG" || {
            echo 'CNB_REPOSITORY_SLUG GitHub Actions variable is required.' >&2
            exit 1
          }
          test -n "$CNB_TOKEN" || {
            echo 'CNB_TOKEN GitHub Actions secret is required.' >&2
            exit 1
          }
          test -n "$CNB_API_TOKEN" || {
            echo 'CNB_API_TOKEN GitHub Actions secret is required.' >&2
            exit 1
          }

      - name: Sync CNB
        run: bash .github/scripts/sync-cnb.sh

      - name: Trigger CNB pipeline
        run: |
          payload="$(jq -cn \
            --arg event 'api_trigger_deploy' \
            --arg branch "$CNB_BRANCH" \
            --arg baselineExistingDb "$BASELINE_EXISTING_DB" \
            --arg runUserIdentityMigration "$RUN_USER_IDENTITY_MIGRATION" \
            '{
              event: $event,
              branch: $branch,
              env: {
                BASELINE_EXISTING_DB: $baselineExistingDb,
                RUN_USER_IDENTITY_MIGRATION: $runUserIdentityMigration
              }
            }')"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.cnb.cool/$CNB_REPOSITORY_SLUG/-/build/start" \
            --header "Authorization: $CNB_API_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$payload" | jq .
