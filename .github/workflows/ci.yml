name: CI

on:
  workflow_dispatch:
    inputs:
      sync_cnb:
        description: Sync the main branch to CNB
        default: false
        type: boolean
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  validate:
    name: Lint & build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./prisma/ci.db
      GITHUB_TOKEN: github_pat
      NUXT_PUBLIC_BAIDU_STAT_KEY: ''
      NUXT_PUBLIC_MS_CLARITY_ID: ''
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Enable corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@12.10.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  sync:
    name: Sync CNB
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.sync_cnb)
    runs-on: ubuntu-latest
    concurrency:
      group: cnb-main-sync
      cancel-in-progress: false
    env:
      CNB_REPOSITORY_SLUG: ${{ vars.CNB_REPOSITORY_SLUG }}
      CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          lfs: true

      - name: Validate CNB configuration
        run: |
          test -n "$CNB_REPOSITORY_SLUG" || {
            echo 'CNB_REPOSITORY_SLUG GitHub Actions variable is required.' >&2
            exit 1
          }
          test -n "$CNB_TOKEN" || {
            echo 'CNB_TOKEN GitHub Actions secret is required.' >&2
            exit 1
          }

      - name: Sync
        run: bash .github/scripts/sync-cnb.sh
