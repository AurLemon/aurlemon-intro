main:
  web_trigger_deploy:
    - &production_deploy
      name: 构建并部署生产环境
      docker:
        image: node:24-bookworm
      git:
        lfs: true
      imports:
        - https://cnb.cool/HydCraft/hydcraft-secrets/-/blob/main/aurlemon-intro-deploy.yml
      stages:
        - name: Build
          script: |
            set -eu
            export COS_MEDIA_PREFIX=intro
            export NUXT_PUBLIC_SITE_MEDIA_BASE_URL=https://img.aurlemon.top/intro
            apt-get update
            apt-get install -y --no-install-recommends openssh-client rsync git-lfs
            rm -rf /var/lib/apt/lists/*

            git lfs install --local
            git lfs pull
            git lfs fsck --objects HEAD

            export DATABASE_URL='file:./prisma/ci.db'
            export GITHUB_TOKEN='github_pat'
            export NUXT_PUBLIC_BAIDU_STAT_KEY=''
            export NUXT_PUBLIC_MS_CLARITY_ID=''

            corepack enable
            corepack prepare pnpm@12.10.1 --activate
            pnpm install --frozen-lockfile
            pnpm db:generate
            if [ "${RUN_USER_IDENTITY_MIGRATION:-false}" = 'true' ]; then
              pnpm db:users:build
            fi
            pnpm media:upload --write
            pnpm build

            rm -rf deploy-artifact
            mkdir -p deploy-artifact/data
            cp package.json pnpm-lock.yaml pnpm-workspace.yaml deploy-artifact/
            cp -R .output deploy-artifact/
            mkdir -p deploy-artifact/prisma
            cp prisma/schema.prisma deploy-artifact/prisma/
            cp -R prisma/migrations deploy-artifact/prisma/
            cp prisma7.config.ts deploy-artifact/
            mkdir -p deploy-artifact/lib
            cp lib/database-url.ts lib/friend-link-browser.ts deploy-artifact/lib/
            mkdir -p deploy-artifact/scripts
            cp scripts/check-friend-link-browser.mjs deploy-artifact/scripts/
            if [ "${RUN_USER_IDENTITY_MIGRATION:-false}" = 'true' ]; then
              cp -R .scripts-dist deploy-artifact/
            fi
            cp -R data/ip2region deploy-artifact/data/
            pnpm install --prod --frozen-lockfile --dir deploy-artifact
            pnpm --dir deploy-artifact exec prisma generate --schema prisma/schema.prisma
            node .cnb/scripts/prepare-browser.mjs deploy-artifact

            test -f deploy-artifact/.playwright/browser.json
            test -f deploy-artifact/scripts/check-friend-link-browser.mjs
            test -f deploy-artifact/.output/server/index.mjs
            test -f deploy-artifact/prisma/schema.prisma
            test -f deploy-artifact/prisma/migrations/migration_lock.toml
            test -f deploy-artifact/node_modules/.bin/prisma
            (cd deploy-artifact && node --input-type=module -e "const client = await import('./generated/prisma/client.ts'); if (typeof client.PrismaClient !== 'function') process.exit(1)")
            if [ "${RUN_USER_IDENTITY_MIGRATION:-false}" = 'true' ]; then
              test -f deploy-artifact/.scripts-dist/scripts/migrate-social-users.js
            fi
            test -f deploy-artifact/data/ip2region/ip2region_v4.xdb

        - name: Deploy
          script: bash ./.cnb/scripts/deploy-production.sh

  api_trigger_deploy:
    - <<: *production_deploy
      name: API 构建并部署生产环境

  web_trigger_media:
    - &media_upload
      name: 同步页面媒体到 COS
      docker:
        image: node:24-bookworm
      git:
        lfs: true
      imports:
        - https://cnb.cool/HydCraft/hydcraft-secrets/-/blob/main/aurlemon-intro-deploy.yml
      stages:
        - name: Upload media
          script: |
            set -eu
            export COS_MEDIA_PREFIX=intro
            export NUXT_PUBLIC_SITE_MEDIA_BASE_URL=https://img.aurlemon.top/intro
            apt-get update
            apt-get install -y --no-install-recommends git-lfs
            rm -rf /var/lib/apt/lists/*
            git lfs install --local
            git lfs pull
            git lfs fsck --objects HEAD
            corepack enable
            corepack prepare pnpm@12.10.1 --activate
            pnpm install --frozen-lockfile --ignore-scripts
            if [ -n "${MEDIA_UPLOAD_FILE:-}" ]; then
              pnpm media:upload --write --file "$MEDIA_UPLOAD_FILE"
            else
              pnpm media:upload --write
            fi

  api_trigger_media:
    - <<: *media_upload
      name: API 同步页面媒体到 COS
