branch:
  - reg: ^main$
    buttons:
      - name: 同步页面媒体
        description: 增量上传 assets/media 到 COS，不部署网站
        event: web_trigger_media
        groupName: 媒体发布
        permissions:
          roles:
            - owner
            - master
        inputs:
          MEDIA_UPLOAD_FILE:
            name: 单个媒体路径（可选）
            description: 留空同步全部，填写 assets/media 下的相对路径可先验证单个文件
            type: input
            default: ''
      - name: 部署生产环境
        description: 在 CNB 构建 main 并部署到生产服务器
        event: web_trigger_deploy
        groupName: 生产部署
        isDefault: true
        permissions:
          roles:
            - owner
            - master
        inputs:
          BASELINE_EXISTING_DB:
            name: 现有数据库基线
            description: 首次接管已有数据库时，标记历史迁移为已应用
            type: switch
            default: false
          RUN_USER_IDENTITY_MIGRATION:
            name: 执行旧用户身份迁移
            description: 仅首次迁移旧 GitHub 用户数据时开启；普通部署保持关闭
            type: switch
            default: false
