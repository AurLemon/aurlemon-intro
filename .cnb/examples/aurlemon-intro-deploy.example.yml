# Copy this file to HydCraft/hydcraft-secrets as aurlemon-intro-deploy.yml.
allow_slugs:
  - HydCraft/aurlemon-intro
allow_events:
  - web_trigger_deploy
  - api_trigger_deploy
  - web_trigger_media
  - api_trigger_media
allow_branches:
  - main

BACKEND_DEPLOY_HOST: your-server.example.com
BACKEND_DEPLOY_SSH_PORT: '233'
# Use the same non-root service user as PM2. If Chromium system libraries
# or Chinese fonts are missing, automatic installation requires non-interactive
# sudo for Playwright install-deps and apt-get (fontconfig / fonts-noto-cjk).
# Alternatively, have an administrator preinstall these dependencies once.
# Deployment logs include the missing dependencies and administrator commands.
BACKEND_DEPLOY_USER: deploy
BACKEND_DEPLOY_SSH_PRIVATE_KEY: |-
  -----BEGIN OPENSSH PRIVATE KEY-----
  replace-with-your-private-key
  -----END OPENSSH PRIVATE KEY-----
BACKEND_REMOTE_DEPLOY_PATH: /www/wwwroot/aurlemon-intro
BACKEND_PM2_APP_NAME: aurlemon-intro

# Static page media only, separate from Nuxt runtime user attachments.
COS_MEDIA_SECRET_ID: <cos-secret-id>
COS_MEDIA_SECRET_KEY: <cos-secret-key>
COS_MEDIA_REGION: ap-shanghai
COS_MEDIA_BUCKET: <media-bucket-with-appid>
COS_MEDIA_PREFIX: intro
NUXT_PUBLIC_SITE_MEDIA_BASE_URL: https://img.aurlemon.top/intro
