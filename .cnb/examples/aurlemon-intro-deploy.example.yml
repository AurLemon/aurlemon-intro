# Copy this file to HydCraft/hydcraft-secrets as aurlemon-intro-deploy.yml.
allow_slugs:
  - HydCraft/aurlemon-intro
allow_events:
  - web_trigger_deploy
  - api_trigger_deploy
allow_branches:
  - main

BACKEND_DEPLOY_HOST: your-server.example.com
BACKEND_DEPLOY_SSH_PORT: '233'
BACKEND_DEPLOY_USER: deploy
BACKEND_DEPLOY_SSH_PRIVATE_KEY: |-
  -----BEGIN OPENSSH PRIVATE KEY-----
  replace-with-your-private-key
  -----END OPENSSH PRIVATE KEY-----
BACKEND_REMOTE_DEPLOY_PATH: /www/wwwroot/aurlemon-intro
BACKEND_PM2_APP_NAME: aurlemon-intro
